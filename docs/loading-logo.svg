<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="187" height="200">
  <style>
    .swing  { transform-origin: 50px 0; animation: swing 1.6s cubic-bezier(.37,0,.63,1) infinite alternate; }
    .slide  { animation: slide 1.6s cubic-bezier(.37,0,.63,1) infinite alternate; }
    @keyframes swing  { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
    @keyframes slide  { from { transform: translateX(21.5px); } to { transform: translateX(-21.5px); } }
  </style>
  <g transform="translate(20 0)"><g class="slide"><ellipse cx="50" cy="142" rx="31" ry="3.5" fill="#000" opacity=".3"/></g>
  <g class="swing">
    <polygon points="39,14 61,14 66,24 80,98 50,124 20,98 34,24" fill="#6366f1" stroke="#6366f1" stroke-width="1" stroke-linejoin="round"/>
    <polygon points="42,48 42,76 64,62" fill="#fff"/>
    <polygon points="40,6 60,6 66,24 34,24" fill="#4f46e5"/>
  </g>
  </g>
</svg>
